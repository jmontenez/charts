# db-migrator — controller mode (b).
# A single controller Job (rendered as an ArgoCD PreSync hook) discovers tenants from
# ham, then fans out one child migration Job per tenant (rendered from the `liquibase`
# library), by batch, isolating per-tenant failures and gating on a failure threshold.
# No tenant list in values — the controller queries ham at runtime.

# Liquibase `-db` image (same ref logic as app: <registry>/<repository>-db:<tag>).
image:
  registry: ""
  repository: "" # e.g. strada/applications/backend/swc/time
  tag: ""        # BUILD_VERSION
imagePullPolicy: ""
dbversion: ""
version: ""
liquibase:
  args: []
  resources: {}

# ham discovery — in-cluster internal port, no auth (AcceptInternal).
ham:
  baseUrl: "http://apitm.strada-back:8083"
  pageSize: 200
  # Optional: only migrate tenants whose statutTenantCode is in this list (comma-sep).
  statusInclude: ""

# DB target (host/port may be plain OR vault-env refs).
database:
  host: "vault:strada/data/common/postgres#url"
  port: 5432
  dbSuffix: "time"          # DB per tenant = "<tenant>.<dbSuffix>"

# Vault (banzaicloud vault-env, injected on the CHILD jobs).
vault:
  role: "time"
  addr: "http://vault.vault:8200"
  skipVerify: true
  dbMount: "strada-db"
  roleSuffix: "time-db"     # DDL static-role = "<tenant>-<roleSuffix>"

# Controller (runs the orchestration script; needs kubectl+curl+jq+envsubst).
controller:
  image: "w6dio/kubectl:1.6.0-slim"
  serviceAccountName: "db-migrator"   # created by rbac.yaml (manages child Jobs)

# Child migration Jobs (one per tenant, run the liquibase library container).
child:
  serviceAccountName: "time"          # SA bound to the Vault role above
  job:
    backoffLimit: 1
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 600

# Orchestration.
batchSize: 25              # max concurrent child Jobs
failThresholdPct: 10       # controller exits non-zero (blocks Sync) above this
jobTimeoutSeconds: 600     # per child Job

# Render the controller as an ArgoCD PreSync hook (set false for a plain Job).
hook:
  enabled: true

rbac:
  create: true
