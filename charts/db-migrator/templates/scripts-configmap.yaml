apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "db-migrator.fullname" . }}-scripts
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
data:
  migrate.sh: |
{{ .Files.Get "files/migrate.sh" | indent 4 }}
  # Child migration Job, one rendered per tenant by the controller (envsubst ${TENANT}
  # ${RUN_ID}). The container itself comes from the shared `liquibase` library (Vault
  # mode), so app's initContainer and this Job share one definition.
  job.tpl.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: "migrate-${TENANT}-${RUN_ID}"
      namespace: {{ .Release.Namespace | quote }}
      labels:
        app.kubernetes.io/component: liquibase
        tenant: "${TENANT}"
    spec:
      backoffLimit: {{ .Values.child.job.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.child.job.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ .Values.child.job.ttlSecondsAfterFinished }}
      template:
        metadata:
          annotations:
            vault.security.banzaicloud.io/vault-addr: {{ .Values.vault.addr | quote }}
            vault.security.banzaicloud.io/vault-role: {{ .Values.vault.role | quote }}
            vault.security.banzaicloud.io/vault-skip-verify: {{ .Values.vault.skipVerify | quote }}
          labels:
            linkerd.io/inject: disabled
        spec:
          serviceAccountName: {{ .Values.child.serviceAccountName | quote }}
          restartPolicy: Never
          containers:
{{ include "liquibase.container" (dict "ctx" . "creds" "vault" "dbName" (printf "${TENANT}.%s" .Values.database.dbSuffix) "userRef" (printf "vault:%s/static-creds/${TENANT}-%s#username" .Values.vault.dbMount .Values.vault.roleSuffix) "passRef" (printf "vault:%s/static-creds/${TENANT}-%s#password" .Values.vault.dbMount .Values.vault.roleSuffix)) | indent 12 }}
