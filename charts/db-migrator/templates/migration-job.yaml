{{- /*
  One migration Job per tenant, rendered as an ArgoCD PreSync hook (runs before the
  app Sync). Batching = ArgoCD sync-waves of .Values.batchSize: waves run in order, so
  at most batchSize Jobs run at once. The liquibase container itself comes from the
  shared `liquibase` library chart (Vault mode: per-tenant creds via vault-env).
*/ -}}
{{- $ctx := . -}}
{{- $batch := int (default 25 .Values.batchSize) -}}
{{- range $i, $tenant := .Values.tenants }}
{{- $wave := div $i $batch }}
{{- $dbName := printf "%s.%s" $tenant $ctx.Values.database.dbSuffix }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "migrate-%s" $tenant | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: {{ include "db-migrator.fullname" $ctx }}
    app.kubernetes.io/component: liquibase
    tenant: {{ $tenant | quote }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: {{ $wave | quote }}
spec:
  backoffLimit: {{ $ctx.Values.job.backoffLimit }}
  activeDeadlineSeconds: {{ $ctx.Values.job.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ $ctx.Values.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      annotations:
        vault.security.banzaicloud.io/vault-addr: {{ $ctx.Values.vault.addr | quote }}
        vault.security.banzaicloud.io/vault-role: {{ $ctx.Values.vault.role | quote }}
        vault.security.banzaicloud.io/vault-skip-verify: {{ $ctx.Values.vault.skipVerify | quote }}
      labels:
        app.kubernetes.io/component: liquibase
        tenant: {{ $tenant | quote }}
        # A linkerd sidecar would keep the Job pod Running forever (never Complete).
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: {{ $ctx.Values.serviceAccount.name | quote }}
      restartPolicy: Never
      containers:
        {{- include "liquibase.container" (dict
              "ctx" $ctx
              "creds" "vault"
              "dbName" $dbName
              "userRef" (include "db-migrator.credRef" (dict "ctx" $ctx "tenant" $tenant "key" "username"))
              "passRef" (include "db-migrator.credRef" (dict "ctx" $ctx "tenant" $tenant "key" "password"))
            ) | nindent 8 }}
{{- end }}
